# D8 / D12: concurrency and determinism policies enforced by clippy, not by review.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# The library's only interior mutability is std's one-shot `OnceLock` / `LazyLock` (D8). Atomics are not
# banned here because only tests use them (counting data sources).
disallowed-types = [
    { path = "std::sync::Mutex", reason = "no locks in the library (D8)" },
    { path = "std::sync::RwLock", reason = "no locks in the library (D8)" },
    { path = "std::cell::Cell", reason = "no interior mutability in shared models (D8)" },
    { path = "std::cell::RefCell", reason = "no interior mutability in shared models (D8)" },
    { path = "std::cell::OnceCell", reason = "not Sync; shared lazy state uses OnceLock / LazyLock (D8)" },
]

# E16: every f64 transcendental goes through `phasekit_core::math`, the one choke point (D12, dependencies R14).
disallowed-methods = [
    { path = "std::env::var", reason = "the library never reads the environment (map 12 R4)" },
    { path = "std::env::var_os", reason = "the library never reads the environment (map 12 R4)" },
    { path = "f64::mul_add", reason = "FMA breaks cross-target determinism (D12, K12)" },
    { path = "f64::powi", reason = "use math::powi: a fixed multiplication chain (D12)" },
    { path = "f64::powf", reason = "use math::powf: the transcendental choke point (D12)" },
    { path = "f64::exp", reason = "use math::exp (D12)" },
    { path = "f64::exp2", reason = "use math:: (D12)" },
    { path = "f64::exp_m1", reason = "use math::expm1 (D12)" },
    { path = "f64::ln", reason = "use math::ln (D12)" },
    { path = "f64::ln_1p", reason = "use math::ln_1p (D12)" },
    { path = "f64::log", reason = "use math::ln (D12)" },
    { path = "f64::log2", reason = "use math:: (D12)" },
    { path = "f64::log10", reason = "use math:: (D12)" },
    { path = "f64::sqrt", reason = "use math::sqrt (D12)" },
    { path = "f64::cbrt", reason = "use math:: (D12)" },
    { path = "f64::hypot", reason = "use math:: (D12)" },
    { path = "f64::sin", reason = "use math:: (D12)" },
    { path = "f64::cos", reason = "use math:: (D12)" },
    { path = "f64::tan", reason = "use math:: (D12)" },
    { path = "f64::asin", reason = "use math:: (D12)" },
    { path = "f64::acos", reason = "use math:: (D12)" },
    { path = "f64::atan", reason = "use math::atan (D12)" },
    { path = "f64::atan2", reason = "use math:: (D12)" },
    { path = "f64::sinh", reason = "use math::sinh (D12)" },
    { path = "f64::cosh", reason = "use math::cosh (D12)" },
    { path = "f64::tanh", reason = "use math:: (D12)" },
    { path = "f64::asinh", reason = "use math:: (D12)" },
    { path = "f64::acosh", reason = "use math:: (D12)" },
    { path = "f64::atanh", reason = "use math:: (D12)" },
]
