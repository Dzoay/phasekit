# Release (PLAN.md §5.4 items 7-8; CONTRIBUTING.md "Versions"; user decisions P1, P5). On a signed tag `vX.Y.Z` on main:
# the C library (`pk_*` and the Tier A shim as phasekit_coolproplib) for Linux x86_64 and aarch64 and Windows x86_64,
# and the npm package (baseline and simd128), each with its licences and cargo-about's notices, attached to a GitHub
# release whose notes are the CHANGELOG section. crates.io and npm publish by trusted publishing, without stored
# tokens, once the repository variable TRUSTED_PUBLISHING is `true`: each registry's first release is manual
# (dependencies R19), and trusted publishing is set up on it afterwards.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_ABOUT_VERSION: "0.9.2" # installed with `--features cli`
  WASM_BINDGEN_VERSION: "0.2.129" # = the wasm-bindgen dependency of phasekit-wasm

defaults:
  run:
    shell: bash

jobs:
  c-library:
    name: C library (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: release-${{ runner.os }}-${{ runner.arch }}-about-${{ env.CARGO_ABOUT_VERSION }}
      - name: Install cargo-about
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.tools --features cli "cargo-about@$CARGO_ABOUT_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: The pk_* library and the shim's build
        run: |
          cargo build --release --locked -p phasekit-capi
          cargo build --release --locked -p phasekit-capi --features coolproplib-shim --target-dir target/shim
      - name: The archive
        run: scripts/release/c-library.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c-library-${{ matrix.target }}
          path: dist/phasekit-*-${{ matrix.target }}.*
          if-no-files-found: error

  npm-package:
    name: npm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-unknown-unknown
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: release-${{ runner.os }}-${{ runner.arch }}-about-${{ env.CARGO_ABOUT_VERSION }}-wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}
      - name: Install cargo-about and wasm-bindgen-cli
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --root ~/.tools --features cli "cargo-about@$CARGO_ABOUT_VERSION"
          cargo install --locked --root ~/.tools "wasm-bindgen-cli@$WASM_BINDGEN_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: The package (its two modules from scripts/release/wasm-modules.sh)
        run: scripts/release/npm-package.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: dist/phasekit-*.tgz
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [c-library, npm-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Release with the archives and the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "phasekit $GITHUB_REF_NAME" --notes-file notes.md dist/*

  crates:
    name: crates.io
    needs: github-release
    if: vars.TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: cargo publish (data, core, compat)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p phasekit-data -p phasekit-core -p phasekit-compat

  npm:
    name: npm
    needs: github-release
    if: vars.TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: dist
      - name: npm publish
        run: npm publish --provenance --access public dist/phasekit-*.tgz
