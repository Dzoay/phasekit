# CI (PLAN.md M0.6, M0.7; the jobs of VERIFICATION.md §11.3). Every job is a required check on `main`. The stable toolchain
# is pinned once, in .github/actions/rust; tools are built from crates.io at pinned versions and cached.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  WASMTIME_VERSION: "49.0.2"
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_NEXTEST_VERSION: "0.9.146"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_SHEAR_VERSION: "1.14.0"
  REUSE_VERSION: "6.2.0"
  GUNGRAUN_VERSION: "0.20.0" # = the gungraun dev-dependency of phasekit-verify (its runner must match)
  CBINDGEN_VERSION: "0.29.2" # `gates abi` regenerates phasekit-capi's header with it (PLAN.md M10.4)
  WASM_BINDGEN_VERSION: "0.2.129" # = the wasm-bindgen dependency of phasekit-wasm (its test runner must match)
  CARGO_ABOUT_VERSION: "0.9.2" # = release.yml's; the site's notices of the modules' crates (PLAN.md M21.1)

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          components: rustfmt
      - name: G1 cargo fmt --all --check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - name: G2 cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: G7 cargo clippy -p phasekit-core -p phasekit-compat --no-default-features --all-targets -- -D warnings
        run: cargo clippy -p phasekit-core -p phasekit-compat --no-default-features --all-targets -- -D warnings
      - name: clippy on the libm backend (PLAN.md M9.3)
        run: cargo clippy -p phasekit-core --features libm --all-targets -- -D warnings
      - name: clippy on the simd feature (PLAN.md M12.4)
        run: cargo clippy -p phasekit-core -p phasekit-verify --features phasekit-verify/simd --all-targets -- -D warnings
      - name: clippy on the Tier A shim's build (PLAN.md M10.6)
        run: cargo clippy -p phasekit-capi --features coolproplib-shim --all-targets -- -D warnings

  linux:
    name: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `gates mutants` diffs against origin/main
      - uses: ./.github/actions/rust
        with:
          components: clippy # clippy_bans_fire runs clippy on the lint probe
          # `gates counts` also measures the G4 run; `gates features` builds the browser package (M10.8)
          targets: wasm32-wasip2,wasm32-unknown-unknown
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-wasmtime-${{ env.WASMTIME_VERSION }}-nextest-${{ env.CARGO_NEXTEST_VERSION }}-deny-${{ env.CARGO_DENY_VERSION }}-shear-${{ env.CARGO_SHEAR_VERSION }}-cbindgen-${{ env.CBINDGEN_VERSION }}
      - name: Install wasmtime, cargo-nextest, cargo-deny, cargo-shear and cbindgen
        if: steps.tools.outputs.cache-hit != 'true'
        run: >-
          cargo install --locked --root ~/.tools "wasmtime-cli@$WASMTIME_VERSION" "cargo-nextest@$CARGO_NEXTEST_VERSION"
          "cargo-deny@$CARGO_DENY_VERSION" "cargo-shear@$CARGO_SHEAR_VERSION" "cbindgen@$CBINDGEN_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: CoolProp checkout cache
        id: coolprop
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/CoolProp
          key: coolprop-${{ hashFiles('scripts/fetch-coolprop.sh') }} # the script pins the commit
      - name: Fetch CoolProp (anonymous clone of the pinned commit)
        if: steps.coolprop.outputs.cache-hit != 'true'
        run: scripts/fetch-coolprop.sh
      - name: G3 cargo nextest run --workspace --profile ci
        run: cargo nextest run --workspace --profile ci
      - name: G3 cargo test --doc --workspace
        run: cargo test --doc --workspace
      - name: Cross-target hash with std and libm maths (PLAN.md M9.4; VERIFICATION.md §9.4)
        run: |
          for features in "" "--features phasekit-core/libm"; do
            # shellcheck disable=SC2086 # an empty or two-word feature list
            cargo nextest run -p phasekit-verify --test cross_target --profile ci --no-capture $features | grep -o 'hash=[0-9a-f]* target=[^ ]* math=[a-z]*' | tee -a hash.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hash-linux
          path: hash.txt
          if-no-files-found: error
      - name: phasekit-core's tests on the libm backend (PLAN.md M9.3; the ulp report in the log)
        run: |
          cargo nextest run -p phasekit-core --features libm --profile ci -E 'not test(std_vs_libm_ulp_report)'
          cargo nextest run -p phasekit-core --features libm --profile ci -E 'test(std_vs_libm_ulp_report)' --no-capture
      - name: The lane tests on the simd feature, at every dispatch level of the runner (PLAN.md M12.4)
        run: |
          cargo nextest run -p phasekit-core --features simd --profile ci -E 'not test(std_vs_libm_ulp_report)'
          cargo nextest run -p phasekit-verify --features simd --test batch --profile ci
      - name: G8 cargo xtask gates all --except mutants,perf (the mutants and perf jobs run those)
        run: cargo xtask gates all --except mutants,perf
      - name: Fluid data changes (job summary; PRs that change data; PLAN.md M2.9a)
        if: github.event_name == 'pull_request'
        run: |
          git diff --quiet origin/main...HEAD -- data crates/phasekit-data && exit 0
          {
            echo "## Fluid data changes against main (\`cargo xtask fluid diff --base origin/main\`)"
            echo
            echo '```'
            cargo xtask fluid diff --base origin/main
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cargo deny check
        run: cargo deny check
      - name: cargo shear
        run: cargo shear
      - name: reuse lint (REUSE 3.3)
        run: pipx run "reuse==$REUSE_VERSION" lint

  # G8's mutants gate as its own job, beside linux rather than after it (user decision CI2): `gates mutants` mutates the
  # PR's own changes against origin/main and runs the workspace tests on each, so it needs what those tests need.
  mutants-shard:
    # User decision CI6: the PR's mutants in four jobs, each `gates mutants --shard k/4`; `mutants` below is the
    # required check and passes only when every shard did.
    name: mutants (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `gates mutants` diffs against origin/main
      - uses: ./.github/actions/rust
        with:
          components: clippy # clippy_bans_fire runs clippy on the lint probe
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-mutants-${{ env.CARGO_MUTANTS_VERSION }}-nextest-${{ env.CARGO_NEXTEST_VERSION }}
      - name: Install cargo-mutants and cargo-nextest
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.tools "cargo-mutants@$CARGO_MUTANTS_VERSION" "cargo-nextest@$CARGO_NEXTEST_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: CoolProp checkout cache
        id: coolprop
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/CoolProp
          key: coolprop-${{ hashFiles('scripts/fetch-coolprop.sh') }} # the script pins the commit
      - name: Fetch CoolProp (anonymous clone of the pinned commit)
        if: steps.coolprop.outputs.cache-hit != 'true'
        run: scripts/fetch-coolprop.sh
      - name: G8 cargo xtask gates mutants, one shard
        run: cargo xtask gates mutants --shard ${{ matrix.shard }}/4

  mutants:
    name: mutants
    needs: mutants-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every mutants shard passed
        env:
          RESULT: ${{ needs.mutants-shard.result }}
        run: |
          echo "mutants shards: $RESULT"
          test "$RESULT" = success

  perf:
    name: perf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          targets: x86_64-unknown-linux-musl
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-gungraun-${{ env.GUNGRAUN_VERSION }}
      - name: Install gungraun-runner (the version of the gungraun dev-dependency)
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.tools "gungraun-runner@$GUNGRAUN_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends valgrind
      - name: G8 cargo xtask gates perf (instruction counts against the committed baseline; PLAN.md M9.6)
        run: cargo xtask gates perf
      - name: The run's counts as a baseline (artifact)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instructions-baseline
          path: target/instructions-baseline.csv
          if-no-files-found: ignore

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust # the stable toolchain, to build cargo-nextest
      - uses: ./.github/actions/rust
        with:
          toolchain: "1.89.0" # the workspace rust-version (D17, user decision MS1): every test builds and runs on it
          components: clippy # clippy_bans_fire runs clippy on the lint probe
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-msrv-nextest-${{ env.CARGO_NEXTEST_VERSION }}
      - name: Install cargo-nextest
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo +1.99.0 install --locked --root ~/.tools "cargo-nextest@$CARGO_NEXTEST_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: CoolProp checkout cache
        id: coolprop
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/CoolProp
          key: coolprop-${{ hashFiles('scripts/fetch-coolprop.sh') }} # the script pins the commit
      - name: Fetch CoolProp (anonymous clone of the pinned commit)
        if: steps.coolprop.outputs.cache-hit != 'true'
        run: scripts/fetch-coolprop.sh
      - name: G3 on the MSRV, cargo nextest run --workspace --profile ci
        run: cargo nextest run --workspace --profile ci
      - name: doctests on the MSRV
        run: cargo test --doc --workspace

  windows:
    name: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-nextest-${{ env.CARGO_NEXTEST_VERSION }}
      - name: Install cargo-nextest
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.tools "cargo-nextest@$CARGO_NEXTEST_VERSION"
      - run: cygpath -w "$HOME/.tools/bin" >> "$GITHUB_PATH" # Git Bash writes /c/...; PATH needs C:\...
      - name: G3 cargo nextest run --workspace --exclude phasekit-xtask --profile ci
        run: cargo nextest run --workspace --exclude phasekit-xtask --profile ci
      - name: G3 cargo test --doc --workspace --exclude phasekit-xtask
        run: cargo test --doc --workspace --exclude phasekit-xtask
      - name: Cross-target hash with std and libm maths (PLAN.md M9.4; VERIFICATION.md §9.4)
        run: |
          for features in "" "--features phasekit-core/libm"; do
            # shellcheck disable=SC2086 # an empty or two-word feature list
            cargo nextest run -p phasekit-verify --test cross_target --profile ci --no-capture $features | grep -o 'hash=[0-9a-f]* target=[^ ]* math=[a-z]*' | tee -a hash.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hash-windows
          path: hash.txt
          if-no-files-found: error

  aarch64:
    name: aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-nextest-${{ env.CARGO_NEXTEST_VERSION }}
      - name: Install cargo-nextest
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.tools "cargo-nextest@$CARGO_NEXTEST_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: G3 cargo nextest run --workspace --exclude phasekit-xtask --profile ci
        run: cargo nextest run --workspace --exclude phasekit-xtask --profile ci
      - name: G3 cargo test --doc --workspace --exclude phasekit-xtask
        run: cargo test --doc --workspace --exclude phasekit-xtask
      - name: The lane tests on the simd feature, at NEON (PLAN.md M12.4)
        run: |
          cargo nextest run -p phasekit-core --features simd --profile ci -E 'not test(std_vs_libm_ulp_report)'
          cargo nextest run -p phasekit-verify --features simd --test batch --profile ci
      - name: Cross-target hash with std and libm maths (PLAN.md M9.4; VERIFICATION.md §9.4)
        run: |
          for features in "" "--features phasekit-core/libm"; do
            # shellcheck disable=SC2086 # an empty or two-word feature list
            cargo nextest run -p phasekit-verify --test cross_target --profile ci --no-capture $features | grep -o 'hash=[0-9a-f]* target=[^ ]* math=[a-z]*' | tee -a hash.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hash-aarch64
          path: hash.txt
          if-no-files-found: error

  wasip2:
    name: wasip2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          targets: wasm32-wasip2
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-wasmtime-${{ env.WASMTIME_VERSION }}-nextest-${{ env.CARGO_NEXTEST_VERSION }}
      - name: Install wasmtime and cargo-nextest
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.tools "wasmtime-cli@$WASMTIME_VERSION" "cargo-nextest@$CARGO_NEXTEST_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: G4 cargo nextest run --workspace --exclude phasekit-xtask --target wasm32-wasip2 --profile ci
        run: cargo nextest run --workspace --exclude phasekit-xtask --target wasm32-wasip2 --profile ci
      - name: G4 cargo test --doc --workspace --exclude phasekit-xtask --target wasm32-wasip2
        run: cargo test --doc --workspace --exclude phasekit-xtask --target wasm32-wasip2
      - name: Cross-target hash with std and libm maths (PLAN.md M9.4; VERIFICATION.md §9.4)
        run: |
          for features in "" "--features phasekit-core/libm"; do
            # shellcheck disable=SC2086 # an empty or two-word feature list
            cargo nextest run -p phasekit-verify --test cross_target --target wasm32-wasip2 --profile ci --no-capture $features | grep -o 'hash=[0-9a-f]* target=[^ ]* math=[a-z]*' | tee -a hash.txt
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hash-wasip2
          path: hash.txt
          if-no-files-found: error
      - name: The lane tests on the simd feature, at simd128 (PLAN.md M12.4; last, as the flag rebuilds everything)
        env:
          RUSTFLAGS: -C target-feature=+simd128
        run: |
          cargo nextest run -p phasekit-core --features simd --target wasm32-wasip2 --profile ci -E 'not test(std_vs_libm_ulp_report)'
          cargo nextest run -p phasekit-verify --features simd --test batch --target wasm32-wasip2 --profile ci

  hash-compare:
    name: hash-compare
    needs: [linux, windows, aarch64, wasip2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hash-*
      - name: The four targets' hashes (job summary; each target's libm run asserts the committed one)
        run: |
          { echo '```'; cat hash-*/hash.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat hash-*/hash.txt
          echo "distinct libm hashes: $(grep -h 'math=libm' hash-*/hash.txt | cut -d' ' -f1 | sort -u | wc -l)"

  wasm-browser:
    name: wasm-browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - name: G5 cargo check --workspace --target wasm32-unknown-unknown
        run: cargo check --workspace --target wasm32-unknown-unknown
      - name: Browser build of the core (fluids-core)
        run: cargo build -p phasekit-core --no-default-features --features fluids-core --target wasm32-unknown-unknown
      - name: Browser build of the core with simd128 (K15)
        run: cargo build -p phasekit-core --no-default-features --features fluids-core --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: -C target-feature=+simd128
      - name: clippy on the browser package (it compiles only for this target)
        run: cargo clippy -p phasekit-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: clippy on its simd128 build, whose simd feature enables core's (PLAN.md M12.10)
        run: cargo clippy -p phasekit-wasm -p phasekit-core --features simd --target wasm32-unknown-unknown -- -D warnings
        env:
          RUSTFLAGS: -C target-feature=+simd128
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-${{ env.WASM_BINDGEN_VERSION }}-about-${{ env.CARGO_ABOUT_VERSION }}
      - name: Install wasm-bindgen-cli and cargo-about
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --root ~/.tools "wasm-bindgen-cli@$WASM_BINDGEN_VERSION"
          cargo install --locked --root ~/.tools --features cli "cargo-about@$CARGO_ABOUT_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      # The runner's Node (an LTS release) runs them; weak references as the package ships (ROT-158).
      - name: The browser package's tests under Node, baseline and simd128 (PLAN.md M10.8)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_WEAKREF: "1"
        run: |
          node --version
          cargo test -p phasekit-wasm --target wasm32-unknown-unknown
          RUSTFLAGS="-C target-feature=+simd128" cargo test -p phasekit-wasm --features simd --target wasm32-unknown-unknown
      # The modules the npm package ships, with their crates' notices, for the `site` job (PLAN.md M21.1).
      - name: The release modules for the site
        run: scripts/release/wasm-modules.sh site-modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-modules
          path: site-modules
          if-no-files-found: error
          retention-days: 7

  # G9, the site's gate (PLAN.md §2.4, M21.1), on the modules `wasm-browser` built; the page it builds is the artifact
  # `site`, which pages.yml deploys after a green run on `main` (user decision WS1).
  site:
    name: site
    needs: wasm-browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-modules
          path: site/src/pk
      - name: The site's packages
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Playwright cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - name: Playwright's Chromium and its system libraries
        working-directory: site
        run: npx --no-install playwright install --with-deps chromium
      - name: G9 scripts/site/check.sh
        env:
          PK_PREBUILT: "1"
          PHASEKIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/site/check.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist
          if-no-files-found: error
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
