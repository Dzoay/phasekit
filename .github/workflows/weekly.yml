# Weekly (VERIFICATION.md §11.3): the tests against the latest compatible dependencies (dependencies §3.4 item 4), and
# a full mutation run as a report (user decision TQ2). PRs gate only their own changes; this finds what slipped by.
name: weekly

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_NEXTEST_VERSION: "0.9.146"

defaults:
  run:
    shell: bash

jobs:
  latest-deps:
    name: latest-deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          components: clippy
      - name: cargo update
        run: cargo update
      - name: G3 cargo test --workspace
        run: cargo test --workspace

  # The full run in 8 shards, each its own job: about 6,700 mutants would take longer than a job may (6 h), and a job
  # killed at its limit would leave no report (user decision CI1). The tests run as in `gates mutants`: nextest
  # (`.cargo/mutants.toml`) and the pinned CoolProp checkout. Each shard reports what survived, also after a timeout.
  mutants:
    name: mutants (report, shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          components: clippy # clippy_bans_fire runs clippy on the lint probe
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-mutants-${{ env.CARGO_MUTANTS_VERSION }}-nextest-${{ env.CARGO_NEXTEST_VERSION }}
      - name: Install cargo-mutants and cargo-nextest
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.tools "cargo-mutants@$CARGO_MUTANTS_VERSION" "cargo-nextest@$CARGO_NEXTEST_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: CoolProp checkout cache
        id: coolprop
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/CoolProp
          key: coolprop-${{ hashFiles('scripts/fetch-coolprop.sh') }} # the script pins the commit
      - name: Fetch CoolProp (anonymous clone of the pinned commit)
        if: steps.coolprop.outputs.cache-hit != 'true'
        run: scripts/fetch-coolprop.sh
      # Two passes, as `gates mutants` runs them (user decision CI5): phasekit-xtask's mutants on its own tests, every
      # other mutant on the workspace's.
      - name: cargo mutants, the other crates, one shard (report only)
        run: cargo mutants --workspace --exclude 'crates/phasekit-xtask/**' --shard "${{ matrix.shard }}/8" --output "$RUNNER_TEMP/workspace" || true
      - name: cargo mutants, phasekit-xtask, one shard (report only)
        if: always()
        run: cargo mutants --package phasekit-xtask --test-workspace false --shard "${{ matrix.shard }}/8" --output "$RUNNER_TEMP/xtask" || true
      - name: Surviving mutants (job summary)
        if: always()
        run: |
          {
            echo "## Surviving mutants, shard ${{ matrix.shard }} of 8"
            for pass in workspace xtask; do
              out="$RUNNER_TEMP/$pass/mutants.out"
              echo
              echo "### $pass"
              echo
              if [ -s "$out/missed.txt" ]; then echo '```'; cat "$out/missed.txt"; echo '```'
              elif [ -f "$out/outcomes.json" ]; then echo "None."
              else echo "No report: the run did not finish, or the shard held none of these mutants."; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants.out-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/workspace/mutants.out
            ${{ runner.temp }}/xtask/mutants.out
          if-no-files-found: warn
