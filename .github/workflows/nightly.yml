# Nightly (VERIFICATION.md §11.3, PLAN.md M1.16), in the pinned runner image of oracle.lock (`runner_image`, an OCI
# digest): every committed oracle fixture is regenerated twice and compared byte for byte (environment drift or
# non-determinism fails), the full set is generated into fixtures-full/, the ignored sweeps run against it (L5), and
# the report goes to the run summary. Fixtures are generated only here (K18): a run dispatched with `regenerate`
# writes them instead and uploads them as the `fixtures` artifact, to be committed. Also the daily RustSec advisory
# check (PLAN.md §5.3): a new advisory against a locked dependency shows up without waiting for a PR. And thread scaling
# on a Linux x86-64 and an aarch64 runner (PLAN.md M9.2): each machine's results file goes to the run summary and the
# `scaling-<runner>` artifact; shared runners' wall clock is informational (user decisions P3, RM1).
name: nightly

on:
  schedule:
    - cron: "23 3 * * *" # daily 03:23 UTC
  workflow_dispatch:
    inputs:
      regenerate:
        description: Regenerate the committed oracle fixtures in the pinned image and upload them
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_NEXTEST_VERSION: "0.9.146"

defaults:
  run:
    shell: bash

jobs:
  lock:
    name: runner image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.lock.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: runner_image from oracle.lock
        id: lock
        run: |
          image=$(awk '$1 == "runner_image" { print $2 }' crates/phasekit-verify/fixtures/oracle.lock)
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "oracle.lock: runner_image is not pinned by digest: $image"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"

  oracle:
    name: oracle (pinned image)
    needs: lock
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.lock.outputs.image }}
    env:
      FIXTURES: crates/phasekit-verify/fixtures
    steps:
      - name: Build tools (git, a C linker; none of them touch the oracle's numbers)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates gcc libc6-dev unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-pinned-image-nextest-${{ env.CARGO_NEXTEST_VERSION }}
      - name: Install cargo-nextest
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.tools "cargo-nextest@$CARGO_NEXTEST_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: CoolProp checkout cache
        id: coolprop
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/CoolProp
          key: coolprop-${{ hashFiles('scripts/fetch-coolprop.sh') }} # the script pins the commit
      - name: Fetch CoolProp
        if: steps.coolprop.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory '*'
          scripts/fetch-coolprop.sh
      - name: AGA8 checkout cache
        id: aga8
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference/AGA8
          key: aga8-${{ hashFiles('scripts/fetch-aga8.sh') }} # the script pins the commit
      - name: Fetch AGA8
        if: steps.aga8.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory '*'
          scripts/fetch-aga8.sh
      - name: The committed oracle fixtures (from MANIFEST.sha256)
        id: sets
        run: echo "facts=$(grep -oE 'coolprop-8\.0\.0/facts/[a-z0-9_]+\.csv' "$FIXTURES/MANIFEST.sha256" | sed -E 's|.*/||; s|\.csv$||' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Regenerate the committed fixtures
        if: inputs.regenerate
        run: |
          for set in ${{ steps.sets.outputs.facts }}; do
            cargo xtask oracle --kind facts --set "$set" --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          done
          cargo xtask oracle --kind checkpoints --out "$FIXTURES" --write-manifest
          cargo xtask oracle --kind crit --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind crit --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind term --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind term --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind eos --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind eos --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind cubic --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind cubic_sat --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind mix_alphar --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind mix_eos --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind mix_crit --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind mix_flash --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind mix_sat --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind mix_env --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind if97 --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind humidair_aux --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind humidair --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind sat --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind sat --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind flash --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind flash --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind sigma --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind sigma --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind melt --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind melt --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind refstate --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind props --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind codes --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind transport --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind transport --tier all --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask oracle --kind transport --set probes --out "$FIXTURES/coolprop-8.0.0" --write-manifest
          cargo xtask teqp --kind aga8 --out "$FIXTURES" --write-manifest
          cargo xtask teqp --kind gerg --out "$FIXTURES" --write-manifest
          cargo xtask teqp --kind gerg_crit --out "$FIXTURES" --write-manifest
          cargo xtask teqp --kind gerg_vle --out "$FIXTURES" --write-manifest
      - name: Upload the regenerated fixtures
        if: inputs.regenerate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixtures
          path: crates/phasekit-verify/fixtures
      - name: Drift and determinism (two regenerations, byte for byte)
        if: ${{ !inputs.regenerate }}
        run: |
          for pass in 1 2; do
            for set in ${{ steps.sets.outputs.facts }}; do
              cargo xtask oracle --kind facts --set "$set" --out "$FIXTURES/coolprop-8.0.0" --check
              echo "pass $pass: facts/$set.csv identical"
            done
            cargo xtask oracle --kind checkpoints --out "$FIXTURES" --check
            echo "pass $pass: mp/check-points.csv identical"
            cargo xtask oracle --kind crit --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind crit --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: crit/*.csv and all/crit.csv identical"
            cargo xtask oracle --kind term --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind term --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: term/*.csv and all/term.csv identical"
            cargo xtask oracle --kind eos --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind eos --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: eos/*.csv and all/eos.csv identical"
            cargo xtask oracle --kind cubic --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind cubic_sat --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: all/cubic.csv and all/cubic_sat.csv identical"
            cargo xtask oracle --kind mix_alphar --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind mix_eos --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind mix_crit --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind mix_flash --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind mix_sat --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind mix_env --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: all/mix_alphar.csv, all/mix_eos.csv, all/mix_crit.csv, all/mix_flash.csv, all/mix_sat.csv and all/mix_env.csv identical"
            cargo xtask oracle --kind if97 --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind humidair_aux --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind humidair --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: all/if97.csv, all/humidair_aux.csv and all/humidair.csv identical"
            cargo xtask oracle --kind sat --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind sat --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: sat/*.csv and all/sat.csv identical"
            cargo xtask oracle --kind flash --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind flash --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: flash/*.csv and all/flash.csv identical"
            cargo xtask oracle --kind sigma --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind sigma --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: sigma/*.csv and all/sigma.csv identical"
            cargo xtask oracle --kind melt --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind melt --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: melt/*.csv and all/melt.csv identical"
            cargo xtask oracle --kind refstate --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: refstate/*.csv identical"
            cargo xtask oracle --kind props --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: props/*.csv identical"
            cargo xtask oracle --kind codes --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: codes/*.csv identical"
            cargo xtask oracle --kind transport --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind transport --tier all --out "$FIXTURES/coolprop-8.0.0" --check
            cargo xtask oracle --kind transport --set probes --out "$FIXTURES/coolprop-8.0.0" --check
            echo "pass $pass: transport/*.csv and all/transport.csv identical"
            cargo xtask teqp --kind aga8 --out "$FIXTURES" --check
            cargo xtask teqp --kind gerg --out "$FIXTURES" --check
            cargo xtask teqp --kind gerg_crit --out "$FIXTURES" --check
            cargo xtask teqp --kind gerg_vle --out "$FIXTURES" --check
            echo "pass $pass: aga8/*.csv and teqp-0.23.2/gerg/*.csv identical"
          done
      - name: The full set into fixtures-full/
        run: |
          for set in ${{ steps.sets.outputs.facts }}; do
            cargo xtask oracle --kind facts --set "$set" --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          done
          cargo xtask oracle --kind checkpoints --out crates/phasekit-verify/fixtures-full
          cargo xtask oracle --kind crit --tier full --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          cargo xtask oracle --kind term --tier full --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          cargo xtask oracle --kind eos --tier full --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          cargo xtask oracle --kind sat --tier full --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          cargo xtask oracle --kind flash --tier full --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          cargo xtask oracle --kind sigma --tier full --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          cargo xtask oracle --kind melt --tier full --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          cargo xtask oracle --kind transport --tier full --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          cargo xtask oracle --kind props --tier full --out crates/phasekit-verify/fixtures-full/coolprop-8.0.0
          cargo xtask fetch-fastchebpure --all crates/phasekit-verify/fixtures-full
      - name: cargo nextest run -p phasekit-verify --cargo-profile release --run-ignored only (L5)
        run: cargo nextest run -p phasekit-verify --cargo-profile release --run-ignored only --profile ci 2>&1 | tee sweep.log
      - name: Report
        if: always()
        run: |
          {
            echo "## Nightly oracle report"
            echo
            echo "Image: \`${{ needs.lock.outputs.image }}\`"
            echo
            echo "Generator: $(grep -m1 '^# generator:' "$FIXTURES/coolprop-8.0.0/facts/smoke.csv" | cut -c3-)"
            echo
            echo "Sweep: $(grep -E '^ *Summary' sweep.log 2>/dev/null | tr '\n' ' ' || echo 'not run')"
            echo
            # Per fluid and kind of each set: rows, failed calls and nan cells; the arbiters; the ignored tests (M20.4).
            # What the sweeps' checks asserted, from the tallies they wrote (M20.4a).
            cargo xtask nightly-report --tallies crates/phasekit-verify/fixtures-full/tallies \
              "$FIXTURES/coolprop-8.0.0" "$FIXTURES/mp" crates/phasekit-verify/fixtures-full/coolprop-8.0.0 ||
              echo "cargo xtask nightly-report failed"
          } >> "$GITHUB_STEP_SUMMARY"

  scaling:
    name: thread scaling (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100 # the latest Plan-Step trailer names the step the results are recorded at
      - uses: ./.github/actions/rust
      - name: cargo xtask bench --record scaling
        run: |
          step=$(git log --grep '^Plan-Step: ' -1 --format=%B | sed -n 's/^Plan-Step: //p' | tail -1)
          cargo xtask bench --record scaling --step "$step"
      - name: Results (run summary)
        run: |
          mkdir -p scaling
          git ls-files --others --modified -- crates/phasekit-verify/benches/results/ | grep '\.scaling\.csv$' | while read -r f; do
            cp "$f" scaling/
            { echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scaling-${{ matrix.runner }}
          path: scaling/
          if-no-files-found: error

  advisories:
    name: advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - name: Tool cache
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-deny-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.tools "cargo-deny@$CARGO_DENY_VERSION"
      - run: echo "$HOME/.tools/bin" >> "$GITHUB_PATH"
      - name: cargo deny check advisories
        run: cargo deny check advisories
