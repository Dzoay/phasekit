# Enforces the PR-title rule in CONTRIBUTING.md: the title becomes the squash commit on main, so it must be a
# Conventional Commit. Adding a crate or scope means adding it to `scopes` below and to CONTRIBUTING.md.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title against CONTRIBUTING.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|test|docs|build|ci|chore|revert'
          scopes='core|data|compat|verify|xtask|capi|wasm|py|plan|deps|repo'
          re="^(${types})(\((${scopes})\))?!?: [^ ].*[^.]$"
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title is not a Conventional Commit (see CONTRIBUTING.md): $TITLE"
            echo "Expected <type>(<scope>)<!>: <summary> with no trailing full stop."
            echo "Types: ${types//|/, }"
            echo "Scopes: ${scopes//|/, }"
            exit 1
          fi
          if (( ${#TITLE} > 72 )); then
            echo "::error::PR title is ${#TITLE} characters; keep it to 72 or fewer."
            exit 1
          fi
          echo "OK: $TITLE"
