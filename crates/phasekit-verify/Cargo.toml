[package]
name = "phasekit-verify"
description = "Zero-dependency verification kit (provenance, tolerances, divergence register, conformance) + corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# verify depends on core, never the reverse: no dev-dependency cycles. Real crate dev-deps (tier T3):
# num-dual (the AD oracle for Jet4, M3), proptest (std only; BatchRequest and Input::new shapes, E12),
# criterion (M2.9) and gungraun (M9) in benches/ (E9; dependencies R18).
# The library reads no fluid: its tests embed all 136 (below), and a crate that dev-depends on it, such as the browser
# package with its five (PLAN.md M21.4), keeps its own set.
[dependencies]
phasekit-core.workspace = true

# The SIMD build of the benches (PLAN.md M12.4): core's `simd` feature, and the `alphar_batch/simd` case that times it.
[features]
simd = ["phasekit-core/simd"]

# The embedded index (`phasekit_data::FLUIDS`) names every fluid the corpus decodes (PLAN.md M2.7).
# allocation-counter (tier T3, user decision AC1, M2.9) counts heap allocations through its own global allocator,
# so the workspace stays free of `unsafe` code.
[dev-dependencies]
allocation-counter = "0.8"
phasekit-core = { workspace = true, features = ["fluids-all"] }
# The Tier A shim's pinned v8.0.0 codes, against the `codes` fixture (tests/codes.rs; PLAN.md M10.6).
phasekit-capi = { workspace = true, features = ["fluids-all"] }
# The PropsSI-style facade, so the seams reach it by name (tests/new_family.rs, tests/gibbs_seam.rs; PLAN.md M5.9).
phasekit-compat = { workspace = true, features = ["fluids-all"] }
# The cubic family, against its oracle kind and in its divergence proofs (tests/cubic.rs, tests/divergences.rs; PLAN.md
# M11.4, M11.7). It dev-depends on this crate in turn, which Cargo allows for dev-dependencies.
phasekit-cubic.workspace = true
# IAPWS water and ice, against the IAPWS releases' tables (tests/iapws.rs; PLAN.md M14.2); it dev-depends on this
# crate too.
phasekit-iapws.workspace = true
# The mixture family, in its divergence proofs (tests/divergences.rs; PLAN.md M13.3); it dev-depends on this crate too.
phasekit-mix.workspace = true
# The AD oracle for Jet4 and the power-term fast path (tests/terms.rs; PLAN.md M3.2): scalar duals only, so no
# nalgebra (dependencies §2.4).
num-dual = { version = "0.15", default-features = false }
phasekit-data.workspace = true

# Wall-clock benches (VERIFICATION.md §12; PLAN.md M2.9): criterion builds for every OS but not for wasm (§2.5).
# 0.7, not 0.8: 0.8 depends on `alloca`, whose C build script breaks the local G6 cross-check for MSVC.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# The thread tests (tests/batch.rs, tests/new_family.rs; PLAN.md M9.1) run core's rayon executor on their own pools;
# wasm builds core without it, so G4 runs the sequential executor (D17).
phasekit-core = { workspace = true, features = ["fluids-all", "rayon"] }
rayon = "1.12"

# Instruction counts (benches/instructions.rs, `cargo xtask gates perf`; PLAN.md M9.6): gungraun runs Valgrind, so
# Linux only (VERIFICATION.md §12); its runner binary, `gungraun-runner`, must be the same version.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "=0.20.0"

