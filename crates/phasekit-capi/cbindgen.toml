# cbindgen's configuration for include/phasekit.h (PLAN.md M10.4; dependencies R15). `cargo xtask gates abi` regenerates
# the header with the pinned cbindgen CLI and fails if it differs from the committed one.
language = "C"
include_guard = "PHASEKIT_H"
autogen_warning = "/* Generated by cbindgen from crates/phasekit-capi (cargo xtask gates abi checks it); do not edit. */"
header = "/* phasekit's C ABI, pk_* (SPDX-License-Identifier: MIT OR Apache-2.0). */"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
