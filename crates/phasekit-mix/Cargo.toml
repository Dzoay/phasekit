[package]
name = "phasekit-mix"
description = "Multi-fluid Helmholtz mixtures (Kunz-Wagner, GERG-2008) as a phasekit model family"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The workspace's licence and NIST's notice for GERG-2008's coefficients, transcribed from NIST's AGA8 code
# (src/gerg/tables.rs; user decisions MX7, MX10); the crate ships the notice as LICENSE-NIST-GERG.
license = "(MIT OR Apache-2.0) AND LicenseRef-NIST-GERG"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# A family crate (docs/DEPENDENCIES.md, the family row): phasekit-core's public API and nothing else, so that its
# milestone holds the core unchanged from `m13-start` (D3; PLAN.md M13, `cargo xtask gates core-frozen`). Not published
# yet: that is the user's call (AGENTS.md).
[dependencies]
phasekit-core.workspace = true

# num-dual, the AD oracle of the departure functions' jets (dependencies T3). The printed check tables and the oracle are
# phasekit-verify's tests (tests/mixture.rs).
[dev-dependencies]
num-dual = { version = "0.15", default-features = false }
# The embedded fluids, the components of the tests' mixtures.
phasekit-core = { workspace = true, features = ["fluids-all"] }

[lints]
workspace = true
