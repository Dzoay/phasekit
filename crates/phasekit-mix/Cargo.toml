# A family crate (docs/DEPENDENCIES.md, the family row): phasekit-core's public API and nothing else, so that its
# milestone holds the core unchanged from `m13-start` (D3; PLAN.md M13, `cargo xtask gates core-frozen`). Not published
# yet: that is the user's call (AGENTS.md).
[dependencies]
phasekit-core.workspace = true

# Until the multi-fluid model reads it (PLAN.md M13.3), the crate holds data only; M13.3 removes this.
[package.metadata.cargo-shear]
ignored = ["phasekit-core"]

