[package]
name = "phasekit-core"
description = "Kernel: numerics, Helmholtz models, relations, registry, flash, saturation, transport, batch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

# D1: features only ADD capability; none but `libm` changes numerics (K13). Core's only third-party dependencies are
# optional (tier T1, docs/DEPENDENCIES.md): `rayon` (M9.1) and `libm` (M9.3). Later, only behind measured or scheduled
# triggers: `simd` (fearless_simd, if the post-0.1 SIMD gate fires; it enables `libm`, user decision SL1) and `json`
# (serde_json, when a runtime-JSON consumer is scheduled; until then the serde mirror lives in phasekit-xtask, S-12).
[features]
default = ["fluids-all"]
embedded = ["dep:phasekit-data"]
fluids-all = ["embedded", "phasekit-data/all"]
fluids-core = ["embedded", "phasekit-data/core"]
# `ExecPolicy::Parallel` runs its fixed chunks on rayon's pool, with the bits of the calling thread's run (K6).
rayon = ["dep:rayon"]
# `math` on the `libm` crate instead of the platform's maths library (M9.3): the one feature that changes numerics,
# for bit-identical results across targets. Opt-in: M9.5 measured it 1.44x std's time (ARCHITECTURE.md D12).
libm = ["dep:libm"]
# `ExecPolicy::Simd` runs its lanes at the CPU's widest level, detected at run time (fearless_simd; PLAN.md M12.4), and
# enables `libm`, so the lanes are the scalar path's bits on every target (user decision SL1).
simd = ["libm", "dep:fearless_simd"]

[dependencies]
phasekit-data = { workspace = true, optional = true }
libm = { version = "0.2.16", optional = true }
rayon = { version = "1.12", optional = true }
fearless_simd = { version = "1.1", optional = true, default-features = false, features = ["std"] }

# T3 dev-only (docs/DEPENDENCIES.md; dependencies §2.12): invariants over any input (PLAN.md M1.14); never in a public API.
[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true
