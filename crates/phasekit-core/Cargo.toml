[package]
name = "phasekit-core"
description = "Kernel: numerics, Helmholtz models, relations, registry, flash, saturation, transport, batch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# D1: features only ADD capability; none changes numerics (K13). Core has zero third-party dependencies
# until M9, when `rayon` and `libm` arrive as optional features. Later, only behind measured or scheduled
# triggers: `simd` (fearless_simd, if the post-0.1 SIMD gate fires) and `json` (serde_json, when a
# runtime-JSON consumer is scheduled; until then the serde mirror lives in phasekit-xtask, S-12).
[features]
default = ["fluids-all"]
embedded = ["dep:phasekit-data"]
fluids-all = ["embedded", "phasekit-data/all"]
fluids-core = ["embedded", "phasekit-data/core"]

[dependencies]
phasekit-data = { workspace = true, optional = true }

# T3 dev-only (dependencies §2.12, §3.1): invariants over any input (PLAN.md M1.14); never in a public API.
[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }

[lints]
workspace = true
