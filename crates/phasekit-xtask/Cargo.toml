[package]
name = "phasekit-xtask"
description = "Developer tasks: datagen, oracle, CI gates (never shipped)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Real crate (tools tier T4): owns the one serde mirror of CoolProp's JSON (serde + serde_json, S-12; M2.1) and
# reaches core's records through `phasekit_core::internal` (M2.3); nalgebra/faer only here (dependencies R7/R9).
[dependencies]
# Every fluid embedded: datagen's tests read the embedded registry, and `packs` packs each fluid's blob (PLAN.md M21.4).
phasekit-core = { workspace = true, features = ["fluids-all"] }
phasekit-data = { workspace = true, features = ["all"] }
phasekit-verify.workspace = true # `MILESTONE`, read by `gates rot`
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# `gates complexity` parses every function (M7.9c, user decision CX4); already in Cargo.lock through serde's derive.
syn = { version = "3.0.6", default-features = false, features = ["full", "parsing", "visit"] }

[dev-dependencies]
# `gerg_2008_is_aga8s` reads GERG-2008's transcription through `phasekit_mix::internal` (PLAN.md M13.5).
phasekit-mix.workspace = true

[lints]
workspace = true
