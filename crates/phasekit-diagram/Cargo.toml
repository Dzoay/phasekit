[package]
name = "phasekit-diagram"
description = "The geometry of thermodynamic diagrams over phasekit: saturation domes, isolines, envelopes, phase regions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# phasekit-core's public API and nothing else (docs/DEPENDENCIES.md, the T1f row; user decisions WS4, DG3), which
# `cargo xtask gates deps` holds. Not published yet: that is the user's call (AGENTS.md).
[dependencies]
phasekit-core.workspace = true

# The tests' fluids: the five embedded ones and the pseudo-pure Air and R410A; the tolerance classes; and a mixture's
# traced envelope (PLAN.md M19.4), which the crate itself takes as data (user decision DG3).
[dev-dependencies]
phasekit-core = { workspace = true, features = ["fluids-all"] }
phasekit-mix.workspace = true
phasekit-verify.workspace = true
# The psychrometric chart's tests fill its seam from humid air (PLAN.md M18.9).
phasekit-humidair.workspace = true
phasekit-iapws.workspace = true

[lints]
workspace = true
