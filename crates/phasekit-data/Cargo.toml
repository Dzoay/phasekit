[package]
name = "phasekit-data"
description = "Generated CoolProp v8.0.0 fluid blobs and name index (data only, no logic)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# D7: one feature per fluid, generated by `xtask datagen`. A fluid's feature enables the features of its
# ECS transport reference fluids, so a subset build can never miss a reference (map 05 §5).
[features]
default = ["all"]
all = ["core", "fluid-r143a"]
core = ["fluid-water", "fluid-nitrogen", "fluid-r134a", "fluid-propane"]
fluid-water = []
fluid-nitrogen = []
fluid-r134a = []
fluid-propane = []
fluid-r143a = ["fluid-r134a"] # ECS transport reference: R134a

[lints]
workspace = true
