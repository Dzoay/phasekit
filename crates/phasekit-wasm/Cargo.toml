[package]
name = "phasekit-wasm"
description = "The browser package: wasm-bindgen over phasekit-compat, the five core fluids and fetched packs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The browser module (`cdylib`, through wasm-bindgen-cli) and the Rust form its tests call (`rlib`).
[lib]
crate-type = ["cdylib", "rlib"]

# Only the browser target has JavaScript: elsewhere (the host, wasip2) the crate is empty and pulls in nothing, so the
# workspace's other builds never link wasm-bindgen's JS imports. E7: the five core fluids, more from packs (E6).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
phasekit-compat = { workspace = true, features = ["fluids-core"] }
# Both builds run the `libm` build's maths, core's own functions and the `libm` crate's, so they give the same bits
# (user decisions SL8, IM6): on wasm std's maths is the `libm` crate's, which core's own replace from PLAN.md M23.2.
phasekit-core = { workspace = true, features = ["libm"] }
# Mixture names over the five fluids and the packs (PLAN.md M13.14; user decision MX5).
phasekit-mix.workspace = true
# The diagrams' geometry (PLAN.md M19.6; user decisions DG1-DG3): planes, lines, a mixture's envelope and the regions.
phasekit-diagram.workspace = true
wasm-bindgen = "0.2.129"

# wasm-bindgen-test runs the tests under Node (tier T3); verify gives them its tolerance classes and fixtures. Neither
# adds a fluid, so the tests run the five the package ships (PLAN.md M21.4).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
phasekit-data.workspace = true # R32's names, for its pack (tests/node.rs; PLAN.md M21.4)
phasekit-verify.workspace = true
wasm-bindgen-test = "0.3.79"

# The simd128 build's (`--features simd` with `-C target-feature=+simd128`): its batch runs core's lanes, 8 to a group
# (PLAN.md M12.10, user decision SL8). A feature rather than a `target_feature` cfg, so that cargo-about's notices and
# cargo tree see the crates it adds.
[features]
simd = ["phasekit-core/simd"]
# Test builds only: `new Registry()` also reads compat's fault-injection names, which panic on purpose (PLAN.md M24.2).
# No build that ships turns it on; CI's wasm-browser job runs tests/panics.rs with it.
fault-injection = ["phasekit-compat/fault-injection"]

# A panic leaves the module unusable, so the panic test is a binary of its own, built with the faults.
[[test]]
name = "panics"
required-features = ["fault-injection"]

[lints]
workspace = true
