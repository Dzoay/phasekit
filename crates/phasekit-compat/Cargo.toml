[package]
name = "phasekit-compat"
description = "PropsSI-style string API, CoolProp names and legacy fill policies over any registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

# E7: the fluid set is forwarded, never implied. phasekit-capi and phasekit-py (default `fluids-all`) and
# phasekit-wasm (`default-features = false, features = ["fluids-core"]`) forward the same three features, and
# CI gates `cargo tree -e features -p phasekit-wasm --target wasm32-unknown-unknown` plus a .wasm size budget.
[features]
default = ["fluids-all"]
embedded = ["phasekit-core/embedded"]
fluids-all = ["embedded", "phasekit-core/fluids-all"]
fluids-core = ["embedded", "phasekit-core/fluids-core"]
# Test builds only: `fault`, a resolver that panics on purpose for four names (PLAN.md M24.1). No build that ships
# turns it on; phasekit-capi's tests and phasekit-wasm's `fault-injection` build do.
fault-injection = []

[dependencies]
phasekit-core.workspace = true
# HAPropsSI (PLAN.md M18.6): humid air and the IF97 water and ice it stands on.
phasekit-humidair.workspace = true
phasekit-iapws.workspace = true

[dev-dependencies]
# The fluid list, for tests over every embedded fluid.
phasekit-data.workspace = true

[lints]
workspace = true

# docs/MIGRATION.md's example, which needs embedded fluids.
[[example]]
name = "migration"
required-features = ["embedded"]
