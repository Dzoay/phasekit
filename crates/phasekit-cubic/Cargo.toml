[package]
name = "phasekit-cubic"
description = "Cubic equations of state (van der Waals, Soave-Redlich-Kwong, Peng-Robinson) as a phasekit model family"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# A family crate (docs/DEPENDENCIES.md, the family row): phasekit-core's public API and nothing else, so that its
# milestone holds the core unchanged (D3; PLAN.md M11, `cargo xtask gates core-frozen`). Not published yet: that is
# the user's call (AGENTS.md).
[dependencies]
phasekit-core.workspace = true

# The conformance kit (phasekit-verify) and num-dual, the AD oracle of the cubic's jets (dependencies T3).
[dev-dependencies]
num-dual = { version = "0.15", default-features = false }
# Its tests compare with the embedded fluids (tests/fluid.rs, tests/saturation.rs).
phasekit-core = { workspace = true, features = ["fluids-all"] }
phasekit-verify.workspace = true

[lints]
workspace = true
