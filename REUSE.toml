# REUSE 3.3 (https://reuse.software): the licence and copyright of every file (PLAN.md M0.7; ROT-141). `reuse lint`
# checks it in CI; licence texts are in LICENSES/. When several annotations match a file, the last one wins.
version = 1

# Everything is the project's own unless a file's header says otherwise.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 The phasekit contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The documents quote other projects' copyright notices (CoolProp, IF97, TEOS-10, NIST) as evidence; those quotes are
# not the documents' own notices.
[[annotations]]
path = "docs/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The phasekit contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# CoolProp 8.0.0 oracle outputs, and data generated from CoolProp's fluid and mixture files: CoolProp's MIT licence and
# its copyright line, verbatim from its v8.0.0 LICENSE (VERIFICATION.md §3.7; LICENSE-THIRD-PARTY).
[[annotations]]
path = [
    "crates/phasekit-verify/fixtures/coolprop-8.0.0/**",
    "crates/phasekit-verify/fixtures/mp/check-points.csv",
    "crates/phasekit-verify/fixtures/oracle.lock",
    "crates/phasekit-data/blobs/**",
    "crates/phasekit-mix/src/generated.rs",
]
precedence = "override"
SPDX-FileCopyrightText = "2012-2018 Ian H. Bell and other CoolProp developers"
SPDX-License-Identifier = "MIT"

# Bell and Deiters' (2021) cubic superancillary coefficients, transcribed number for number from CoolProp 8.0.0's
# include/CoolProp/superancillary/cubicsuperancillary.h (ported there from teqp, MIT): CoolProp's MIT licence and
# copyright line (PLAN.md M11.5; user decision 3a).
[[annotations]]
path = "crates/phasekit-cubic/src/superancillary/tables.rs"
precedence = "override"
SPDX-FileCopyrightText = "2012-2018 Ian H. Bell and other CoolProp developers"
SPDX-License-Identifier = "MIT"

# GERG-2008's coefficients transcribed from NIST's AGA8 code, AGA8's test data and teqp's GERG-2008 vectors (PLAN.md
# M13.5; user decision MX7): NIST's notice and disclaimer, which AGA8 and teqp both carry.
[[annotations]]
path = [
    "crates/phasekit-mix/src/gerg/tables.rs",
    "crates/phasekit-mix/LICENSE-NIST-GERG",
    "crates/phasekit-verify/fixtures/aga8/**",
    "crates/phasekit-verify/fixtures/teqp-0.23.2/**",
]
precedence = "override"
SPDX-FileCopyrightText = "NIST (AGA8 and teqp authors)"
SPDX-License-Identifier = "LicenseRef-NIST-GERG"

# Check values transcribed from papers: the transcription is the project's; the cells are numerical facts, each file
# citing its source in its header (VERIFICATION.md §3.7).
[[annotations]]
path = "crates/phasekit-verify/fixtures/paper/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The phasekit contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# CoolProp 8.0.0's output units, transcribed from its DataStructures.cpp for the site's tests (PLAN.md M21.7): CoolProp's
# MIT licence and copyright line, as its other oracle data.
[[annotations]]
path = "site/tests/unit/coolprop-units.ts"
precedence = "override"
SPDX-FileCopyrightText = "2012-2018 Ian H. Bell and other CoolProp developers"
SPDX-License-Identifier = "MIT"

# Inter, the site's typeface (PLAN.md M21.1), from its v4.1 release: the SIL Open Font License 1.1.
[[annotations]]
path = "site/src/assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Hashes phasekit computes over its own results (the cross-target hash, VERIFICATION.md §9.4): the project's own.
[[annotations]]
path = "crates/phasekit-verify/fixtures/hash/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The phasekit contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# NIST fastchebpure's multiprecision saturation files, converted, and their pin (VERIFICATION.md §3.7; user decisions
# 3a, 3b; PLAN.md M6.1). The licence text records the decision-3a facts and the NIST disclaimer.
[[annotations]]
path = [
    "crates/phasekit-verify/fixtures/mp/fastchebpure-*/**",
    "crates/phasekit-verify/fixtures/mp/fastchebpure.lock",
]
precedence = "override"
SPDX-FileCopyrightText = "NIST (fastchebpure authors)"
SPDX-License-Identifier = "LicenseRef-fastchebpure"
