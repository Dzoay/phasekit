# The phasekit workspace (docs/ARCHITECTURE.md §2), seeded from docs/history/sketch at M0.2. Crates use the
# `phasekit-` prefix and C symbols `pk_` (D16, decided 2026-10-05). Members are the M0 crates (core, data,
# verify, xtask); phasekit-compat joins at M5.9, phasekit-capi and phasekit-wasm at M10 and phasekit-py after
# 0.1 (S-11).
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/phasekit-xtask/probes"] # lint probes, built only in scratch copies (M0.3)

[workspace.package]
version = "0.1.0" # all published crates share one version (CONTRIBUTING.md "Versions")
edition = "2024"
rust-version = "1.89" # one workspace MSRV (D17, user decision MS1); raised only for a concrete feature
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dzoay/phasekit"
readme = "README.md"
keywords = ["thermodynamics", "fluid-properties", "equation-of-state", "coolprop"]
categories = ["science", "simulation"]
# Unpublished unless a crate says otherwise: core, data and compat do (PLAN.md §5.4 item 7).
publish = false

# E7: default features are OFF on every internal dependency, so feature unification can never make a
# facade embed more fluids than it asked for. Each consumer names its fluid set explicitly.
[workspace.dependencies]
phasekit-capi = { path = "crates/phasekit-capi", default-features = false }
phasekit-compat = { path = "crates/phasekit-compat", version = "0.1.0", default-features = false }
phasekit-core = { path = "crates/phasekit-core", version = "0.1.0", default-features = false }
phasekit-cubic = { path = "crates/phasekit-cubic" }
phasekit-iapws = { path = "crates/phasekit-iapws", version = "0.1.0" }
phasekit-humidair = { path = "crates/phasekit-humidair", version = "0.1.0" }
phasekit-mix = { path = "crates/phasekit-mix" }
phasekit-diagram = { path = "crates/phasekit-diagram" }
phasekit-data = { path = "crates/phasekit-data", version = "0.1.0", default-features = false }
phasekit-verify = { path = "crates/phasekit-verify" }

# D17: workspace lints. phasekit-capi (M10) relaxes `unsafe_code` to `deny` and allows `disallowed_types` in
# its FFI-state modules only: thread-local error and handle table, plus the CoolPropLib.h shim's
# process-wide errstring (D11, E13); every other crate inherits this table unchanged.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
# D12 / S-06 / E12: no panic is reachable from library code; unfinished work returns a typed error.
todo = "deny"
unimplemented = "deny"
panic = "deny"
# ROT-024: no printing from library code; diagnostics travel as values (`SolvePath`, `Root`, `Status`).
# phasekit-xtask, a command-line tool, allows both at its crate root.
print_stdout = "deny"
print_stderr = "deny"
# User decision CX2 (PLAN.md M7.9c): a function over 100 lines of code (`clippy.toml`), Sonar's length bar.
too_many_lines = "deny"

# User decision BP1 (2026-10-07): whole-program optimisation for what this workspace builds itself (the benches, and
# later the C library, the wheel and the wasm module). Crates that depend on phasekit build with their own profile.
# No `target-cpu`: artifacts stay generic x86-64, like the C++ baseline (VERIFICATION.md §12).
[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

# The mutants gate's build (`.cargo/mutants.toml`, `profile = "mutants"`): the test profile, optimised. The same tests
# and assertions, overflow checks and debug assertions included (inherited from `test`), and the same floating-point
# results (Rust does not reorder or contract floating-point arithmetic at any opt-level); the numeric tests run about
# 5.7× faster (the workspace suite on the M5 stack: 57 s at opt-level 0, 10 s at 1). No debug info: shorter links.
[profile.mutants]
inherits = "test"
opt-level = 1
debug = false

# User decision SP1 (2026-10-11): phasekit-core, phasekit-xtask and every dependency build optimised in the dev profile,
# and so in `test` and `mutants`, which inherit it. Each datagen test regenerates all 136 fluids, most of it in
# phasekit-core: the workspace suite on the M7.5 stack took 134 s (1 018 test CPU-seconds, 831 of them xtask's) at
# opt-level 0, 117 s with only xtask and the dependencies optimised, and 44 s (335) with phasekit-core too. Overflow
# checks and debug assertions stay on, and floating-point results do not change (see `mutants`), which datagen's
# byte-for-byte tests and `gates datagen` check. The other workspace crates stay at opt-level 0.
[profile.dev.package.phasekit-core]
opt-level = 2

[profile.dev.package.phasekit-xtask]
opt-level = 2

# User decision SP2 (2026-10-18): phasekit-mix too, whose debug mixture tests took 50-106 s each at opt-level 0 (the GERG
# gas's stability tests and critical-point searches; tests/mixture_family.rs).
[profile.dev.package.phasekit-mix]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
