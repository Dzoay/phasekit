# cargo-mutants configuration for `cargo xtask gates mutants` (PLAN.md M0.4a; user decisions TQ1, TQ2). A mutant of
# changed code that no test catches fails the gate unless it is excluded here, and every exclusion says why no test
# can catch it.

# Never copy gitignored files (reference/, the CoolProp checkout) into cargo-mutants' scratch tree; `gates mutants`
# names the checkout's own reference/ in PHASEKIT_REFERENCE_DIR, so tests that read the pinned data still run (M2.1).
gitignore = true
# A mutant in phasekit-core must be caught by any workspace test, phasekit-verify's corpus included. `gates mutants` and
# the weekly run test phasekit-xtask's mutants on its own tests alone (`--test-workspace false`, user decision CI5).
test_workspace = true
# Every workspace test in one parallel pool, each in its own process, stopping at the first failure
# (`.config/nextest.toml`, profile `default`): a caught mutant ends with its first failing test instead of waiting for
# every earlier test binary. nextest does not run doctests; G3 does.
test_tool = "nextest"
# Build every mutant with `[profile.mutants]` (Cargo.toml): optimised, so the tests a mutant runs take a fraction of
# the time; the same tests and assertions.
profile = "mutants"
# cargo-mutants times its baseline on the mutated packages only, yet tests every mutant against the whole workspace
# (`test_workspace`), so the timeout it derives (a multiple of the baseline) is shorter than one full run: a mutant no
# test catches ran out of time and counted as caught (measured 2026-10-07 on M5.4: a 12 s baseline, a 38 s timeout, a
# 55 s workspace run). This floor covers a full run with room to spare: on CI's runner the workspace suite took 43-76 s
# in the test profile (4 runs, 2026-10-12; the mutants profile builds the other crates at opt-level 1, so it runs no
# slower), and 300 s is about 4 times the slowest. A mutant that really hangs (a loop that never ends) costs this much;
# it was 600 s until user decision CI4.
minimum_test_timeout = 300

exclude_globs = [
    # Process glue (runs cargo, git and rustc; reads and writes files): G8 itself exercises it, unit tests cannot.
    "crates/phasekit-xtask/src/repo.rs",
    "crates/phasekit-xtask/src/main.rs",
    # The FP guard off Linux (PLAN.md M10.7): Windows x64's MXCSR and every other target's no-op. They do not compile
    # where the mutants job runs; the Windows runner runs their tests (`pk_exports_restore_the_callers_fp_environment`).
    "crates/phasekit-capi/src/fp/windows.rs",
    "crates/phasekit-capi/src/fp/none.rs",
]

exclude_re = [
    # Equivalent mutants of the bracketed density solve (PLAN.md M7.1): `pressure < p` follows a return on
    # `pressure == p`, so `<=` takes the same branch; a zero slope gives a step of ±∞ or NaN, which bisects whether the
    # guard says `> 0` or `>= 0`; and `liquid_above`'s bracket test differs at `>=` only where p(T, ρ) equals p exactly,
    # where the solve it hands the bracket to returns that very ρ.
    "density\\.rs:[0-9]+:[0-9]+: replace < with <= in bracketed",
    "density\\.rs:[0-9]+:[0-9]+: replace > with >= in bracketed",
    "density\\.rs:[0-9]+:[0-9]+: replace > with >= in liquid_above",
    # Equivalent mutants of T+X (PLAN.md M7.5). A cell is cut at a turn where its ends' slopes have opposite signs,
    # `a·b < 0`: `a/b < 0` is the same test, and `<= 0` differs only where a slope is exactly 0 at a node, where the cut
    # falls on that node and the pieces hold the same roots. A piece is searched where an end's residual is exactly 0 or
    # the ends' signs differ; with `&&` for the first `||`, a root exactly on a node is still found from the cell that
    # it ends, unless x only touches the value there. And a fluid whose saturation at T fails with `NoConvergence` from
    # the VLE is a pseudo-pure one: a pure fluid's below its curve's top comes from the curve (T+X; DP's `isochore_p`).
    "flash/isotherm\\.rs:[0-9]+:[0-9]+: replace \\* with / in cell_roots",
    "flash/isotherm\\.rs:[0-9]+:[0-9]+: replace < with <= in cell_roots",
    "flash/isotherm\\.rs:[0-9]+:[0-9]+: replace \\|\\| with && in cell_roots",
    "flash/isotherm\\.rs:[0-9]+:[0-9]+: replace match guard pseudo_pure with true in tx",
    "flash/isochore\\.rs:[0-9]+:[0-9]+: replace match guard pseudo_pure\\(\\) with true in isochore_p",
    # Equivalent mutants of the Q-pairs (PLAN.md M7.7). A turn is a node where x stops rising or falling,
    # `(g1 > g0) != (g2 > g1)`, and its kind `g1 > g0`: `>=` differs only at an exact tie of two nodes, whose cells then
    # find no turn but an end. The golden-section search keeps the lower of two values, `gc < gd`, and `<=` differs only
    # at a tie. Polish takes a bracket whose end's residual is exactly 0 or whose ends' signs differ; with `&&` for the
    # first `||` a root exactly on the bracket's lower end still has ends of opposite sign unless x only touches it. And
    # without its caloric curves (`decode_caloric` giving none) a Q-pair scans QT's own state, as a pseudo-pure fluid's
    # does, and finds the same roots: the curves only make the scan cheaper (user decision CC2).
    "flash/quality\\.rs:[0-9]+:[0-9]+: replace > with >= in with_turns",
    "flash/quality\\.rs:[0-9]+:[0-9]+: replace < with <= in turn_of",
    "flash/quality\\.rs:[0-9]+:[0-9]+: replace \\|\\| with && in polish",
    "blob\\.rs:[0-9]+:[0-9]+: replace decode_caloric -> Result<Option<CaloricCurves>, LoadError> with Ok\\(None\\)",
    # Equivalent mutants of HS and SU (PLAN.md M7.8), whose descent and bisections read a residual as above zero by
    # `positive`, as the search in T of P+X and D+X does (M7.9e; its reason below). A residual exactly 0 (within the
    # nested solve's noise) is the root whether a test reads it as above (`>= 0`) or at or below x: TOMS 748 returns a
    # bracket's end whose residual is 0. And a bracket of two decades with a refusal between them, taken as if none
    # were there, meets that refusal inside TOMS 748, which splits the bracket around it, as the guarded arm's
    # bisection does.
    "flash/search\\.rs:[0-9]+:[0-9]+: replace > with >= in positive",
    "flash/isentrope\\.rs:[0-9]+:[0-9]+: replace match guard refused.is_none\\(\\) with true in isentrope_bracket",
    # Each gate's `run` gathers its input through `repo` and is exercised by G8, not by unit tests; the rules it
    # applies live in the module's pure functions, which are mutated.
    "replace run -> Verdict",
    "in run$",
    # `fetch-fastchebpure`'s `run` downloads, unpacks and writes through `repo`, like a gate's `run`; the nightly runs it,
    # and what it applies (the conversion, the lock and the manifest lines) is the module's pure functions, mutated.
    "fastchebpure\\.rs:.*replace run -> Result<String, String>",
    # `gates::main` and `usage` dispatch the subcommands and print the verdicts: G8 runs them on every PR.
    "replace (main|usage) -> ExitCode",
    "in (main|usage)$",
    # Equivalent mutants of SHA-256's Ch and Maj, written as FIPS 180-4 writes them: in Ch the two terms are bitwise
    # disjoint, and in Maj any two set terms are covered by the third, so `^` and `|` give the same bits. The NIST
    # vectors in sha256.rs test everything else.
    "sha256\\.rs:(27:30|30:31|30:41): replace \\^ with \\| in sha256",
    # Equivalent: at x = θτ = 0 both branches of the generalized Planck-Einstein term evaluate c + d, d/(c + d) and
    # c/(c + d) bit for bit, so moving 0 from one branch to the other changes nothing.
    "ideal\\.rs:[0-9]+:[0-9]+: replace > with >= in planck_einstein_generalized",
    # Equivalent: for a double q >= 0.5, q - 1 is exact (Sterbenz) and |q - 1| a multiple of 2^-53, which neither
    # fl(1e-3) nor fl(0.1) is; below 0.5, |q - 1| > 0.5. So `<` and `<=` agree on every input of the near-critical window.
    "tolerance\\.rs:[0-9]+:[0-9]+: replace < with <= in Window::at",
    # Equivalent: TOMS 748's doubled secant on a tie |f(a)| = |f(b)| (so f(a) = −f(b)) moves from a to b or from b to
    # a, more than half the bracket either way, so both choices of u give the midpoint; and a move of exactly half the
    # bracket lands on the midpoint, so `>` and `>=` choose the same point.
    "roots\\.rs:[0-9]+:[0-9]+: replace (< with <=|> with >=) in Bracket::doubled_secant",
    # Equivalent in practice: the VLE's distinct-phase test, ln(ρ′/ρ″) > 1e-6, and `>=` differ only when the logarithm
    # equals 1e-6 bit for bit, which no state built from double densities reaches reliably on every target; 2e-6 and
    # 5e-7 are tested on either side.
    "vle\\.rs:[0-9]+:[0-9]+: replace > with >= in distinct",
    # Equivalent in practice: the saturation check's Θ = (Tc − T)/Tc of a file row equals 1e-8 (where the VLE stops
    # being compared) or 1e-2 (where its conditioning starts being measured) bit for bit in no file; rows on either
    # side of both are tested.
    "phasekit-verify/src/saturation\\.rs:[0-9]+:[0-9]+: replace < with <= in SaturationCheck::(seeded_vle|vle_row)",
    # Equivalent: the ancillaries section's flags are two disjoint bits (exponential, τ_r), so `|` and `^` give one byte.
    "blob\\.rs:[0-9]+:[0-9]+: replace \\| with \\^ in ancillaries",
    # Equivalent in practice: the density Newton refuses a slope (∂p/∂ln ρ)_T ≤ 0; one exactly 0 from double arithmetic
    # at an iterate never occurs, so `>` and `>=` agree; slopes of either sign are tested.
    "density\\.rs:[0-9]+:[0-9]+: replace > with >= in newton",
    # Equivalent in practice: the search in T of P+X and D+X (`root_in_t`, each step's residual `stepped`, and the
    # descent's `positive`) compares x(T) − x with 0 at its bracket's ends and scan steps, so `<` and `<=`, `>` and `>=`
    # differ only where x is met bit for bit at such a T, which no input reaches reliably; either side of each
    # comparison is tested (PLAN.md M7.3, M7.4).
    "flash/search\\.rs:[0-9]+:[0-9]+: replace (< with <=|<= with <|> with >=|>= with >) in (root_in_t|stepped)",
    # Equivalent in practice: a pure fluid's phase rule labels by its EOS's own critical point (M6), so its VLE runs only
    # where the EOS has a dome, and no tested input makes it fail there; only a pseudo-pure fluid, labelled by its
    # published critical point above its EOS's, reaches a VLE that fails (Air from 131 K to 132.53 K at 13 119 mol/m³,
    # `d_x_round_trips`), so following the single phase for every fluid changes no tested result.
    "flash/isochore\\.rs:[0-9]+:[0-9]+: replace match guard pseudo_pure\\(\\) with true in isochore_x",
    # Equivalent in practice: the generic VLE's pressure at T_low equals a P+X input's p bit for bit only by chance;
    # pressures below and above it are tested (`p_x_without_a_curve_uses_the_eos_vle`).
    "flash/isobar\\.rs:[0-9]+:[0-9]+: replace < with <= in generic_sat_p",
    # Equivalent: a pseudo-pure PQ is refused only when the pressure ancillary has no root in its range, which it has at
    # its own value at Tmax, so p equal to that bound never reaches the comparison; above and below are tested.
    "saturation\\.rs:[0-9]+:[0-9]+: replace > with >= in <impl SaturationCurve for PseudoPureCurve>::at_p",
    # Equivalent in practice (M8.6): the transport forms' branch comparisons are CoolProp's strict ones, and differ from
    # `<=` or `>` only at equality, where both branches give the same λ to rounding or no state lands exactly: the
    # Olchowy-Sengers cut-off (a numerator of exactly 10ε), and Friend's methane at T = T_c or ρ = ρ_c (the ancillary
    # branch), |T*| = 0.03 and |ρ*| = 0.03 or 1e-16 (its χ equations). Each branch either side is reached by the
    # oracle's probes (`transport/probes.csv`).
    "transport/conductivity\\.rs:[0-9]+:[0-9]+: replace < with <= in olchowy_sengers",
    "transport/conductivity\\.rs:[0-9]+:[0-9]+: replace < with <= in friend_methane",
    "transport/conductivity\\.rs:[0-9]+:[0-9]+: replace < with <= in friend_chi",
    "transport/conductivity\\.rs:[0-9]+:[0-9]+: replace >= with > in friend_chi",
    # Equivalent (CI, M8.6): Friend's θ test (line 201) T* < −|ρ*|^(−1/β)/s holds at every state that reaches it, since |ρ*| < 0.03
    # puts the bound above 3000, and so does the mutant's −|ρ*|^(−1/β)·s; and the Olchowy-Sengers cut-off at ε/10
    # instead of 10ε changes only numerators below 2.2e-15, where the enhancement is about 1e-20 W/(m K).
    "transport/conductivity\\.rs:201:36: replace / with \\* in friend_chi",
    "transport/conductivity\\.rs:[0-9]+:[0-9]+: replace \\* with /$",
    # Equivalent (M8.7): the IAPWS water forms' comparisons are CoolProp's strict ones, and differ from `<=` or `>=` only
    # at equality, where both sides give the same value: Δχ̄ = 0 is clamped to 0 either way; R12-08's two Y(ξ) branches
    # meet at ξ = 0.3817016416 nm, the release's switch point; at q_C ξ = 1, w = 0 and both forms of L are 0; at
    # y = 1.2e-7, Z(y) is 0 to rounding (R15-11 Eq. (21)). Each branch either side is reached by the release tables.
    "transport/iapws\\.rs:[0-9]+:[0-9]+: replace < with <= in correlation_length",
    "transport/iapws\\.rs:[0-9]+:[0-9]+: replace < with <= in y_of_xi",
    "transport/iapws\\.rs:[0-9]+:[0-9]+: replace > with >= in y_of_xi",
    "transport/iapws\\.rs:[0-9]+:[0-9]+: replace < with <= in water_conductivity",
    # Equivalent (M8.8): the conformal solve accepting a step that leaves the residual equal, not only one that lowers
    # it, changes only which iterate within rounding of the root it returns; and f_int's T/T_r with T_r = 1 K, in every
    # v8.0.0 ECS block, is T·T_r (pinned to its line and column).
    "transport/ecs\\.rs:[0-9]+:[0-9]+: replace < with <= in conformal_state",
    "transport/ecs\\.rs:175:39: replace / with \\* in conductivity",
    # Equivalent (M8.9): Chung's association factor κ is 0 in both v8.0.0 Chung blocks (Cyclopentane, Isopentane), so
    # the signs of the a₃ row, which κ multiplies, and of κ in Aᵢ and F_c change no value (pinned to their columns).
    "transport/hardcoded\\.rs:310:(71|92|111): delete - in chung",
    "transport/hardcoded\\.rs:(315:96|316:64): replace \\+ with - in chung",
    # Equivalent (M8.9): the hard-coded forms' comparisons are CoolProp's strict ones, and differ from `<=` only at
    # equality, where both sides give the same value: Tufeu's ammonia term at its floor (the reduced temperature is the
    # floor either way) and at ρ = 0.6 ρ_c (its two density branches are one expression there); helium's critical term
    # at 12 K, where exp(−18.66 ΔT²) puts it 1e-15 below λ, under `TransportDirect`, and at W = 1, where the blend
    # W κ_T + (1 − W) κ_T' is κ_T. The probes sit on 3.5 K, where the term is not, and 12 K, and either side of W = 1.
    "transport/hardcoded\\.rs:[0-9]+:[0-9]+: replace < with <= in ammonia_critical",
    "transport/hardcoded\\.rs:363:36: replace < with <= in helium_conductivity",
    "transport/hardcoded\\.rs:[0-9]+:[0-9]+: replace > with >= in helium_critical",
    # Equivalent (M8.11): a melting curve's searches past its segments differ from their `>=` and `<=` only at a bound,
    # and a pressure or temperature on a segment's bound is held by that segment first: the curve's highest p, a gap's
    # ends, the curve's lowest T (pinned to their lines and columns).
    "melting\\.rs:114:14: replace > with >= in MeltingCurve::locate",
    "melting\\.rs:118:(68|77): replace < with <= in MeltingCurve::locate",
    "melting\\.rs:158:26: replace < with <= in MeltingCurve::pressure",
    # Equivalent (M8.11): the flash refuses T < T_melt·(1 − AT_BOUND); `<=` differs only at that product exactly, which
    # no solved state reaches (T_melt is read at the state's own p).
    "flash\\.rs:168:87: replace < with <= in above_melting_line",
    # Equivalent (M9.1): a batch of one chunk skips rayon, `chunk < n`; with `<=` that one chunk goes to rayon, whose
    # parallel iterator runs a single piece inline on the calling thread, the same thread and bits.
    "batch\\.rs:[0-9]+:[0-9]+: replace < with <= in evaluate",
]
