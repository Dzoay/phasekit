# D8 / D12: concurrency and determinism policies enforced by clippy, not by review.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# The library's only interior mutability is std's one-shot `OnceLock` / `LazyLock` (D8). Atomics are banned too
# (ROT-031): only phasekit-capi's FFI-state modules may allow them (M10.4), and a test that counts across threads
# allows them on its counter alone. Each stable atomic type is listed by name.
disallowed-types = [
    { path = "std::sync::Mutex", reason = "no locks in the library (D8)" },
    { path = "std::sync::RwLock", reason = "no locks in the library (D8)" },
    { path = "std::cell::Cell", reason = "no interior mutability in shared models (D8)" },
    { path = "std::cell::RefCell", reason = "no interior mutability in shared models (D8)" },
    { path = "std::cell::OnceCell", reason = "not Sync; shared lazy state uses OnceLock / LazyLock (D8)" },
    { path = "std::sync::atomic::AtomicBool", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicI8", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicI16", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicI32", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicI64", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicIsize", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicU8", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicU16", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicU32", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicU64", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicUsize", reason = "no shared counters or flags in the library (D8, ROT-031)" },
    { path = "std::sync::atomic::AtomicPtr", reason = "no shared counters or flags in the library (D8, ROT-031)" },
]

# No per-thread state (D8, ROT-268); only phasekit-capi's thread-local last error may allow it (M10.4).
disallowed-macros = [
    { path = "std::thread_local", reason = "no per-thread state or scratch (D8, ROT-268)" },
]

# The environment and the filesystem are out of bounds for the library (ROT-015, ROT-016, ROT-153): every `std::fs`
# function that reaches the filesystem, and the `Path` methods that query it. E16: every f64 transcendental goes
# through `phasekit_core::math`, the one choke point (D12, dependencies R14).
disallowed-methods = [
    { path = "std::env::var", reason = "the library never reads the environment (map 12 R4)" },
    { path = "std::env::var_os", reason = "the library never reads the environment (map 12 R4)" },
    { path = "std::env::vars", reason = "the library never reads the environment (map 12 R4)" },
    { path = "std::env::vars_os", reason = "the library never reads the environment (map 12 R4)" },
    { path = "std::env::home_dir", reason = "no home-directory lookup (map 12 R4, ROT-153)" },
    { path = "std::fs::canonicalize", reason = "the library never touches the filesystem (ROT-153)" },
    { path = "std::fs::copy", reason = "the library never touches the filesystem (ROT-153)" },
    { path = "std::fs::create_dir", reason = "the library never touches the filesystem (ROT-153)" },
    { path = "std::fs::create_dir_all", reason = "the library never touches the filesystem (ROT-153)" },
